<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
    <title>Document</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/media.css" >
</head>
<body>
    <main class="container">
        <div>
            <img src="img/t-shirt.jpg" alt="t-shirt">
        </div>
        <div>
            <p class="title">My Store</p>
            <div class="product-name">
                <h1 >BANANA BLISS OVERSIZED T-SHIRT</h1>
                <button class="show-size" id="show-size">show size</button>
            </div>
            
            <h2 class="price">Rs. 1,178.82</h2>
            <p class="link title">Taxes included. <a href="#" >Shipping</a> calculated at checkout.</p>
            <div>
                <p class="title">Sizes</p>
                <div class="sizes-container">
                    <button>S</button>
                    <button>M</button>
                    <button>L</button>
                    <button>XL</button>
                    <button>XXL</button>
                </div>
                <div class="quantity-box">
                    <p class="title">Quantity</p>
                    <div class="quantity-btn">
                        <button>+</button>
                        <span>1</span>
                        <button>-</button>
                    </div>
                </div>
                <div class=" product-btn-container ">
                    <button>Add to Cart</button>
                    <button>Buy it Now</button>
                </div>
            </div>
        </div>
    </main>

<div class="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <button class="popup-close" id="PopBtn" aria-label="Close popup">×</button>

  <img id="chartImg" src="img/Size Chart.png" alt="Size Chart" />

  <h2 id="popupTitle" class="popup-title">Product Previews</h2>

  <div class="carousel-container">
    <div class="carousel-track">
      <img src="img/img1.jpg" alt="Product 1" />
      <img src="img/img2.jpg" alt="Product 2" />
      <img src="img/img3.jpg" alt="Product 3" />
      <img src="img/img4.jpg" alt="Product 4" />
      <img src="img/img5.jpg" alt="Product 5" />
      <img src="img/img6.jpg" alt="Product 6" />
      <img src="img/img7.jpg" alt="Product 7" />
    </div>
  </div>
</div>


    <script src="index.js"></script>
</body>
</html>
